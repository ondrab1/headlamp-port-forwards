name: Release

# Tagging is the whole trigger: push v0.1.0 and the rest happens here. Building
# in CI also removes the trap of a hand-made release - the tarball embeds file
# timestamps, so its checksum differs on every build, and a checksum taken from
# a different build than the uploaded file makes Headlamp refuse the install.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the tag matches the declared versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          hub=$(grep -m1 '^version:' artifacthub-pkg.yml | awk '{print $2}')

          echo "tag=$tag package.json=$pkg artifacthub-pkg.yml=$hub"
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$hub" ]; then
            echo "::error::Version mismatch. Bump package.json and artifacthub-pkg.yml to $tag before tagging."
            exit 1
          fi

          expected="persistent-port-forwards-$tag.tar.gz"
          if ! grep -q "$expected" artifacthub-pkg.yml; then
            echo "::error::archive-url in artifacthub-pkg.yml does not point at $expected"
            exit 1
          fi

      - run: npm run tsc
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run package-release

      - name: Collect the artifact and its checksum
        id: artifact
        run: |
          version="${GITHUB_REF_NAME#v}"
          file="persistent-port-forwards-$version.tar.gz"
          checksum=$(sha256sum "$file" | awk '{print $1}')

          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
          echo "Built $file with checksum $checksum"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The changelog comes from artifacthub-pkg.yml so the release and the
          # plugin catalog describe the same thing.
          node scripts/release-notes.mjs > notes.md

          cat >> notes.md <<EOF

          ## Install

          Download \`${{ steps.artifact.outputs.file }}\` below, or install through Headlamp's
          plugin catalog once ArtifactHub has picked this version up.

          \`\`\`
          sha256: ${{ steps.artifact.outputs.checksum }}
          \`\`\`
          EOF

          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.artifact.outputs.file }}" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md

      # ArtifactHub reads the manifest from the default branch, not from the tag,
      # so the checksum of the artifact just published has to land on main.
      - name: Record the checksum on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main
          git checkout -B main origin/main

          python3 - "$GITHUB_REF_NAME" "${{ steps.artifact.outputs.checksum }}" <<'PY'
          import re, sys
          tag, checksum = sys.argv[1], sys.argv[2]
          path = 'artifacthub-pkg.yml'
          text = open(path).read()
          updated = re.sub(
              r'(headlamp/plugin/archive-checksum:\s*")[^"]*(")',
              rf'\g<1>SHA256:{checksum}\g<2>',
              text,
          )
          if updated == text:
              print(f'Checksum already current for {tag}, nothing to record.')
          open(path, 'w').write(updated)
          PY

          if git diff --quiet artifacthub-pkg.yml; then
            echo "Nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record release checksum for $GITHUB_REF_NAME" artifacthub-pkg.yml
          git push origin main
