name: Release

# Tagging is the trigger: push v0.1.0 and the rest happens here. Building in CI
# also removes the trap of a hand-made release - the tarball embeds file
# timestamps, so its checksum differs on every build, and a checksum taken from
# a different build than the uploaded file makes Headlamp refuse the install.
#
# workflow_dispatch exists because a push event can be lost - during an Actions
# outage no run is created, and GitHub never replays it. Re-running by hand then
# beats deleting and re-pushing the tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v0.1.5. It must already exist.'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Always the tag, never the branch: on workflow_dispatch the default
      # checkout would be whatever main happens to hold.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the tag matches the declared version
        run: |
          tag="${TAG#v}"
          pkg=$(node -p "require('./package.json').version")

          echo "tag=$tag package.json=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Version mismatch. Bump package.json to $tag before tagging."
            exit 1
          fi

          if [ ! -f artifacthub-pkg.template.yml ]; then
            echo "::error::artifacthub-pkg.template.yml is missing; there is nothing to publish the catalog entry from."
            exit 1
          fi

      - run: npm run tsc
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run package-release

      - name: Collect the artifact and its checksum
        id: artifact
        run: |
          version="${TAG#v}"
          file="persistent-port-forwards-$version.tar.gz"
          checksum=$(sha256sum "$file" | awk '{print $1}')

          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
          echo "Built $file with checksum $checksum"

      - name: Publish the release
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The changelog comes from the manifest template so the release and
          # the plugin catalog describe the same thing.
          node scripts/release-notes.mjs artifacthub-pkg.template.yml > notes.md

          cat >> notes.md <<EOF

          ## Install

          Download \`${{ steps.artifact.outputs.file }}\` below, or install through Headlamp's
          plugin catalog once ArtifactHub has picked this version up.

          \`\`\`
          sha256: ${{ steps.artifact.outputs.checksum }}
          \`\`\`
          EOF

          gh release create "$TAG" \
            "${{ steps.artifact.outputs.file }}" \
            --title "$TAG" \
            --notes-file notes.md

          published=$(gh release view "$TAG" --json publishedAt -q .publishedAt)
          echo "published=$published" >> "$GITHUB_OUTPUT"

      # Only now, with the artifact published, does the catalog get to hear
      # about this version. ArtifactHub reads main and hands what it finds to
      # Headlamp's in-app catalog, so a version announced before its release is
      # one the catalog offers and cannot install. Doing it in this order means
      # a lost trigger or a failed build leaves the catalog merely one version
      # behind, which the next run fixes.
      #
      # A folder per version, because ArtifactHub indexes files: one
      # artifacthub-pkg.yml is one version, and overwriting a single manifest -
      # which is what this repository used to do - erased the version before it
      # from the catalog along with its changelog.
      - name: Announce the release on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main
          git checkout -B main origin/main

          python3 - "$TAG" "${{ steps.artifact.outputs.checksum }}" "$GITHUB_REPOSITORY" "${{ steps.publish.outputs.published }}" <<'PY'
          import os, re, sys
          tag, checksum, repo, published = sys.argv[1:5]
          version = tag[1:] if tag.startswith('v') else tag

          text = open('artifacthub-pkg.template.yml').read()

          # The template's leading comment explains what a human edits; the
          # generated file says what it is instead.
          text = re.sub(r'\A(#[^\n]*\n)+', '', text)
          text = (
              f'# Generated by .github/workflows/release.yml for {tag}.\n'
              f'# Edit artifacthub-pkg.template.yml instead; this file is a record of a\n'
              f'# published release and changing it rewrites what the catalog offers.\n'
          ) + text

          url = (
              f'https://github.com/{repo}/releases/download/{tag}/'
              f'persistent-port-forwards-{version}.tar.gz'
          )

          def one(pattern, replacement, text):
              text, count = re.subn(pattern, replacement, text, count=1, flags=re.M)
              if count != 1:
                  sys.exit(f'Template does not carry a line matching {pattern!r}.')
              return text

          text = one(r'^version:.*$', f'version: {version}', text)
          text = one(r'^createdAt:.*$', f'createdAt: "{published}"', text)
          text = one(r'^(\s*headlamp/plugin/archive-url:).*$', lambda m: f'{m.group(1)} "{url}"', text)
          text = one(
              r'^(\s*headlamp/plugin/archive-checksum:).*$',
              lambda m: f'{m.group(1)} "SHA256:{checksum}"',
              text,
          )

          path = os.path.join('releases', version, 'artifacthub-pkg.yml')
          os.makedirs(os.path.dirname(path), exist_ok=True)
          open(path, 'w').write(text)
          print(f'Wrote {path}')
          PY

          # add, not commit -am: the file is new, and -a would skip it.
          git add releases

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish $TAG to ArtifactHub"
          git push origin main

      # A push made with GITHUB_TOKEN does not start a workflow - GitHub stops
      # runs from triggering runs - so the commit above never reaches CI's
      # catalog job on its own, and the entry this release just wrote would go
      # unchecked until somebody happened to push to main for another reason.
      # That is the gap 0.1.5 fell through. Checking it here closes it: the
      # working tree is main as just pushed, so this validates the new entry
      # against the artifact published minutes ago.
      - name: The entry just written resolves to the artifact just published
        run: ./scripts/check-catalog.sh
