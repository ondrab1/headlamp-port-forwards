name: Release

# Tagging is the trigger: push v0.1.0 and the rest happens here. Building in CI
# also removes the trap of a hand-made release - the tarball embeds file
# timestamps, so its checksum differs on every build, and a checksum taken from
# a different build than the uploaded file makes Headlamp refuse the install.
#
# workflow_dispatch exists because a push event can be lost - during an Actions
# outage no run is created, and GitHub never replays it. Re-running by hand then
# beats deleting and re-pushing the tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v0.1.5. It must already exist.'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Always the tag, never the branch: on workflow_dispatch the default
      # checkout would be whatever main happens to hold.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the tag matches the declared version
        run: |
          tag="${TAG#v}"
          pkg=$(node -p "require('./package.json').version")
          hub=$(grep -m1 '^version:' artifacthub-pkg.yml | awk '{print $2}')

          echo "tag=$tag package.json=$pkg artifacthub-pkg.yml=$hub"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Version mismatch. Bump package.json to $tag before tagging."
            exit 1
          fi

          # The manifest is expected to still name the previous release here:
          # this job writes the new version into it only once the artifact it
          # points at exists. Finding the new one already there is not fatal -
          # the release still publishes - but main advertised a version nobody
          # could download until now.
          if [ "$tag" = "$hub" ]; then
            echo "::warning::artifacthub-pkg.yml already declares $tag. Leave version and archive-url to this workflow; only changes: is yours to edit."
          fi

      - run: npm run tsc
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run package-release

      - name: Collect the artifact and its checksum
        id: artifact
        run: |
          version="${TAG#v}"
          file="persistent-port-forwards-$version.tar.gz"
          checksum=$(sha256sum "$file" | awk '{print $1}')

          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
          echo "Built $file with checksum $checksum"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The changelog comes from artifacthub-pkg.yml so the release and the
          # plugin catalog describe the same thing.
          node scripts/release-notes.mjs artifacthub-pkg.yml > notes.md

          cat >> notes.md <<EOF

          ## Install

          Download \`${{ steps.artifact.outputs.file }}\` below, or install through Headlamp's
          plugin catalog once ArtifactHub has picked this version up.

          \`\`\`
          sha256: ${{ steps.artifact.outputs.checksum }}
          \`\`\`
          EOF

          gh release create "$TAG" \
            "${{ steps.artifact.outputs.file }}" \
            --title "$TAG" \
            --notes-file notes.md

      # Only now, with the artifact published, does main get to say the new
      # version exists. ArtifactHub reads that manifest from the default branch
      # and hands it to Headlamp's in-app catalog, so a version written there
      # before its release is one the catalog offers and cannot install. Doing
      # it in this order means a lost trigger or a failed build leaves main
      # pointing at the last release that really is downloadable.
      - name: Announce the release on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main
          git checkout -B main origin/main

          python3 - "$TAG" "${{ steps.artifact.outputs.checksum }}" "$GITHUB_REPOSITORY" <<'PY'
          import re, sys
          tag, checksum, repo = sys.argv[1], sys.argv[2], sys.argv[3]
          version = tag[1:] if tag.startswith('v') else tag
          path = 'artifacthub-pkg.yml'
          text = open(path).read()

          current = re.search(r'^version:\s*(\S+)', text, re.M).group(1)
          number = lambda v: [int(part) for part in re.findall(r'\d+', v)]

          # Re-releasing an old tag by hand must not walk the catalog backwards
          # to a version main has already moved past.
          if number(version) < number(current):
              print(f'main already advertises {current}; leaving it alone rather than moving back to {version}.')
              sys.exit(0)

          url = (
              f'https://github.com/{repo}/releases/download/{tag}/'
              f'persistent-port-forwards-{version}.tar.gz'
          )

          text = re.sub(r'^version:\s*\S+', f'version: {version}', text, count=1, flags=re.M)
          text = re.sub(
              r'(headlamp/plugin/archive-url:\s*")[^"]*(")',
              lambda m: f'{m.group(1)}{url}{m.group(2)}',
              text,
          )
          text = re.sub(
              r'(headlamp/plugin/archive-checksum:\s*")[^"]*(")',
              rf'\g<1>SHA256:{checksum}\g<2>',
              text,
          )

          open(path, 'w').write(text)
          print(f'main now advertises {version}.')
          PY

          if git diff --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Publish $TAG to ArtifactHub"
          git push origin main
