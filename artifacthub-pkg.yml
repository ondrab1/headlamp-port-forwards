changes:
  - kind: added
    description: "Delete now asks for confirmation, and a forward from the shared ConfigMap can be removed from it in the same step instead of being edited out by hand"
  - kind: fixed
    description: "Starting or stopping a forward shows progress right away, instead of looking like the click did nothing until the list refreshed"
