version: 0.1.0
name: headlamp_persistent_port_forwards
displayName: Persistent Port Forwards
createdAt: "2026-08-21T13:00:00Z"
description: Port forwards that survive a restart, start themselves, and can be shared with your team through a ConfigMap.
license: Apache-2.0
homeURL: https://github.com/ondrab1/headlamp-port-forwards
logoURL: https://raw.githubusercontent.com/ondrab1/headlamp-port-forwards/refs/heads/main/docs/logo.png
links:
  - name: source
    url: https://github.com/ondrab1/headlamp-port-forwards
  - name: issues
    url: https://github.com/ondrab1/headlamp-port-forwards/issues
screenshots:
  - title: Port Forwarding list
    url: https://raw.githubusercontent.com/ondrab1/headlamp-port-forwards/refs/heads/main/docs/port-forwarding-list.png
  - title: Plugin settings
    url: https://raw.githubusercontent.com/ondrab1/headlamp-port-forwards/refs/heads/main/docs/plugin-settings.png
keywords:
  - headlamp
  - kubernetes
  - port-forward
  - debugging
maintainers:
  - name: Ondřej Beneš
    email: ondrab97@gmail.com
changes:
  - kind: added
    description: "Initial release"
  - kind: added
    description: "Replaces the Port Forwarding page with one that remembers forwards across restarts"
  - kind: added
    description: "One-click Resume for a stopped forward, re-resolving the pod when it targets a Service"
  - kind: added
    description: "Bulk Resume and Stop for selected rows"
  - kind: added
    description: "Persistent forwards, stored per cluster in the plugin settings"
  - kind: added
    description: "Shared forwards read from a ConfigMap in the cluster, with Create and Copy YAML bootstrap"
  - kind: added
    description: "Opt-in auto-start per forward, settable for both local and shared forwards"
  - kind: added
    description: "Custom names for forwards, shown instead of the service name"
  - kind: added
    description: "Running/total indicator in the app bar, with progress while forwards are starting"
annotations:
  headlamp/plugin/archive-url: "https://github.com/ondrab1/headlamp-port-forwards/releases/download/v0.1.0/persistent-port-forwards-0.1.0.tar.gz"
  headlamp/plugin/archive-checksum: "SHA256:7031e9a47ca25eca6d827fb50c8f4d0d792f9f6a2b568add4c9bbd7b056f12fa"
  headlamp/plugin/version-compat: ">=0.30"
  headlamp/plugin/distro-compat: "linux,windows,mac"
install: |
  ## Headlamp Desktop

  1. Open Headlamp.
  2. Open the Plugin Catalog.
  3. Search for "Persistent Port Forwards".
  4. Click Install.
  5. Restart Headlamp if required.
