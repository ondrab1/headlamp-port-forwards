changes:
  - kind: fixed
    description: "Deleting a forward the backend no longer knows about now works, instead of failing as unreachable and leaving the row in place"
  - kind: fixed
    description: "Error messages carry the HTTP status, so a missing forward no longer reads as a network problem"
annotations:
